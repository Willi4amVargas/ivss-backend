services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ivss_v2}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ivss_v2}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    volumes:
      - ./data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  icd-api:
    image: whoicd/icd-api
    ports:
      - '5045:80'
    environment:
      - include=2026-01_es
      - acceptLicense=true
      - saveAnalytics=true
      - enableDoris=false

  app:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Dentro de la red de Compose las dependencias se resuelven por nombre de
      # servicio, no por "localhost". Estos valores pisan los del .env.
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ICD_API_LOCAL_URL: 'http://icd-api/'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      icd-api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
