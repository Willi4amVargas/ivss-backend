services:
  icd-api:
    image: whoicd/icd-api
    ports:
      - '5045:80'
    environment:
      - include=2026-01_es
      - acceptLicense=true
      - saveAnalytics=true
      - enableDoris=false
    restart: unless-stopped
  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    volumes:
      - ./data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped